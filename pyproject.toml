[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pgmcraft-studio"
version = "1.2.2"
description = "DAW/PGM beat analysis and project package generator"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
keywords = ["audio", "daw", "pgm", "beat-tracking", "midi", "tempo-map", "beatnet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13"
]

dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "soundfile>=0.12.0",
    "librosa>=0.9.0",
    "pretty_midi>=0.2.9",
    "mido>=1.3.0",
    "matplotlib>=3.5.0",
    "gradio>=4.0.0",
    "BeatNet>=1.1.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
downloaders = [
    "yt-dlp>=2024.1.0",
    "pydub>=0.25.1"
]
ai = [
    "basic-pitch>=0.4.0",
    "crepe>=0.0.16"
]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
pgm-craft = "pgm_craft.cli:main"
