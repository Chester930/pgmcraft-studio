[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pgm-craft"
version = "1.0.0"
description = "AI Audio Stem Separation, Music Transcription & Live PGM Backing Track Suite"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
keywords = ["audio", "music-transcription", "stem-separation", "pgm", "beat-tracking", "demucs", "beatnet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13"
]

dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "soundfile>=0.12.0",
    "librosa>=0.9.0",
    "pretty_midi>=0.2.9",
    "mido>=1.3.0",
    "matplotlib>=3.5.0",
    "gradio>=4.0.0",
    "BeatNet>=1.1.0"
]

[project.scripts]
pgm-craft = "pgm_craft.cli:main"
